<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="description" content="Music by 0001. An open-source grid arrangement player with audio loops and waveforms."><title>Music</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2399ff73'/%3E%3Cpath d='M8 13v6m4-10v14m4-18v22m4-16v10m4-7v4' stroke='%23171717' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css"><script src="clips.js" defer></script><script src="layout.js" defer></script><script src="sweeps.js" defer></script><script src="app.js" defer></script>
</head><body><main id="canvas" aria-label="Music grid">
<section class="transport" aria-label="Playback controls"><div class="transport-left"><button id="track-view" class="view-button" aria-label="Switch to musical notation" aria-pressed="false" title="Switch to musical notation">Notation</button><button id="play" class="play-button" aria-label="Play arrangement"><span class="play-icon" aria-hidden="true">▶</span></button><button id="stop" class="stop-button" aria-label="Stop and return to the beginning" title="Stop"><span aria-hidden="true">■</span></button><div class="timing"><label class="tempo"><input id="tempo" type="number" min="70" max="160" step="1" value="112" aria-label="Tempo in beats per minute"></label></div></div></section>
<div id="message" role="status" aria-live="polite"></div>
<section class="session" aria-label="Track arrangement"><div class="arrangement"><div id="tracks"></div></div></section>
<section class="vertical-section" aria-label="Vertical Pulse arrangement"><div id="vertical-track"></div></section>
<div id="piano-track"></div>
<div id="selection-marquee" aria-hidden="true" hidden></div></main><div id="track-menu" class="context-menu" role="menu" aria-label="Track" hidden><button id="orientation" role="menuitem"></button><div class="color-label" role="presentation">Color</div><div id="track-colors" class="color-palette" role="group" aria-label="Ezo colors"></div></div></body></html>
