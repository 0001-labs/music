<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="description" content="Music by 0001. An open-source grid arrangement player with audio loops and waveforms."><title>Music</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2399ff73'/%3E%3Cpath d='M8 13v6m4-10v14m4-18v22m4-16v10m4-7v4' stroke='%23171717' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css"><script src="board.js"></script><script src="clips.js" defer></script><script src="samples.js" defer></script><script src="demo.js" defer></script><script src="layout.js" defer></script><script src="sweeps.js" defer></script><script src="history.js" defer></script><script src="pitch.js" defer></script><script src="blocks.js" defer></script><script src="keyboard.js" defer></script><script src="app.js" defer></script>
</head><body><button id="music-settings" class="music-header" aria-expanded="false" aria-controls="settings" title="Settings">Music</button><main id="canvas" tabindex="-1" aria-label="Music grid">
<section id="settings" class="transport" aria-label="Settings" hidden><div class="transport-left"><button id="save-arrangement" class="save-button" title="Save arrangement">Save</button><select id="load-arrangement" aria-label="Load arrangement"><option value="">Load</option></select><input id="arrangement-file" type="file" accept=".json,application/json" hidden><button id="reset" class="reset-button" title="Restore the demo arrangement" aria-label="Reset to the demo arrangement">Reset</button><button id="undo" hidden class="history-button" aria-label="Undo" title="Undo (⌘Z / Ctrl+Z)" disabled>↶</button><button id="redo" hidden class="history-button" aria-label="Redo" title="Redo (⇧⌘Z / Ctrl+Shift+Z)" disabled>↷</button><button id="play" hidden class="play-button" aria-label="Play all track loops" title="Play loops"><span class="play-icon" aria-hidden="true">▶</span></button><button id="play-arrangement" hidden class="arrangement-button" aria-label="Play arrangement from 0.0 to the last track" title="Play arrangement once from 0.0">▶</button><button id="stop" hidden class="stop-button" aria-label="Stop and return to the beginning" title="Stop"><span aria-hidden="true">■</span></button><button id="effects-toggle" class="reset-button reverb-button" aria-pressed="false" title="Effect map: set which edge of the canvas each effect is strongest at">Effects</button><div id="global-loop-controls" aria-label="White playback areas"></div><div class="timing"><label class="tempo"><input id="tempo" title="Tempo (BPM)" type="number" min="70" max="160" step="1" value="112" aria-label="Tempo in beats per minute"></label></div></div></section>
<div id="message" role="status" aria-live="polite"></div>
<section class="session" aria-label="Track arrangement"><div class="arrangement"><div id="tracks"></div></div></section>
<div id="selection-marquee" aria-hidden="true" hidden></div></main><div id="track-menu" class="context-menu" role="menu" aria-label="Track" hidden><button id="delete-track" role="menuitem">Delete</button></div></body></html>
